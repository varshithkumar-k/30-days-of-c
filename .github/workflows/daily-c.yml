name: Daily C lesson
on:
  push:
    paths:
      - '.github/workflows/daily-c.yml'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-c-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and publish one verified C lesson per day
        shell: python
        run: |
          import datetime, json, pathlib, shutil, subprocess
          from zoneinfo import ZoneInfo
          root = pathlib.Path('.')
          bank = root / 'lesson-bank'
          programs = root / 'programs'
          state_path = root / '.github' / 'daily-c-state.json'
          today = datetime.datetime.now(ZoneInfo('Asia/Kolkata')).date()
          start = datetime.date(2026, 10, 31)
          if not state_path.exists():
              lessons = sorted(programs.glob('day-*'))
              assert len(lessons) == 30, 'Expected 30 existing lessons before resetting'
              assert not bank.exists(), 'Archive already exists; inspect before resetting'
              shutil.copytree(programs, bank)
              assert len(list(bank.glob('day-*/main.c'))) == 30
              shutil.rmtree(programs)
              programs.mkdir()
              state = {'published': 0, 'last_date': None}
          else:
              state = json.loads(state_path.read_text())
          lessons = sorted(bank.glob('day-*'))
          assert len(lessons) == 30
          published_today = False
          if today >= start and state['published'] < 30 and state['last_date'] != today.isoformat():
              lesson = lessons[state['published']]
              source = lesson / 'main.c'
              subprocess.run(['gcc', '-std=c17', '-Wall', '-Wextra', '-Werror', '-pedantic', str(source), '-o', '/tmp/daily-c'], check=True)
              actual = subprocess.check_output(['/tmp/daily-c'], text=True, timeout=10)
              notes = (lesson / 'README.md').read_text()
              expected = notes.split('## Expected output', 1)[1].split('```text\n', 1)[1].split('```', 1)[0]
              assert actual == expected, (lesson.name, actual, expected)
              destination = programs / lesson.name
              assert not destination.exists()
              shutil.copytree(lesson, destination)
              state['published'] += 1
              state['last_date'] = today.isoformat()
              published_today = True
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          readme = "# 30 Days of C\n\n30 original AI-assisted C17 learning examples, republished one per day from **31 October to 29 November 2026**, scheduled for **9:07 AM IST**. GitHub Actions may run later than the scheduled time.\n\n"
          readme += "The earlier complete collection is preserved in [lesson-bank](lesson-bank). Daily publications appear in programs below. Existing Git history is preserved.\n\n"
          readme += "## Originality\n\nCode and explanations were generated for this project without copying third-party repositories or paid courses. Common exercises may have similar implementations elsewhere; exhaustive copyright clearance is not claimed.\n\n"
          readme += "## Published lessons\n\n"
          for lesson in sorted(programs.glob('day-*')):
              readme += f"- [{lesson.name}]({lesson.as_posix()}/README.md)\n"
          readme += f"\nProgress: **{state['published']}/30**.\n\n## Scheduling\n\nOne lesson is compiled with strict warnings and its sample output checked before each daily publication. Retries cannot publish twice on the same IST date. The workflow stops publishing after 30 lessons; missed days can extend the completion date.\n"
          (root / 'README.md').write_text(readme)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'programs', 'lesson-bank', 'README.md', str(state_path)], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              message = f"Publish scheduled C lesson {state['published']:02d}" if published_today else "Prepare 30 preserved C lessons for daily republication"
              subprocess.run(['git', 'commit', '-m', message], check=True)
              subprocess.run(['git', 'push'], check=True)
